[SERVICE]
    # Flush
    # =====
    # Set an interval of seconds before flushing records to a destination.
    Flush        5

    # Daemon
    # ======
    # Instruct Fluent Bit to run in foreground or background mode.
    Daemon       Off

    # Log_Level
    # =========
    # Verbosity: error, warning, info, debug, trace. Per-flush detail from the
    # zerobus plugin is emitted at 'debug'.
    Log_Level    info


[INPUT]
    Name cpu
    Tag  cpu

# Zerobus Output
# ==============
# Streams records to a Databricks Zerobus table via the Zerobus SDK. Records
# are serialized to JSON; the SDK handles gRPC streaming, OAuth2, and TLS.
[OUTPUT]
    Name  zerobus
    Match *

    # Ingestion_Endpoint
    # ==================
    # Zerobus gRPC endpoint: <workspace-id>.zerobus.<region>.cloud.databricks.com
    # The <workspace-id> prefix is required and must match the workspace that
    # issues the OAuth token (the SDK reads it from the first hostname label).
    ingestion_endpoint     https://1234567890123456.zerobus.us-west-2.cloud.databricks.com

    # Unity_Catalog_Endpoint
    # ======================
    # Workspace URL. The SDK mints the OAuth token from
    # <unity_catalog_endpoint>/oidc/v1/token, scoped to Unity Catalog privileges
    # on the target table, so the service principal must hold USE CATALOG /
    # USE SCHEMA / SELECT + MODIFY there.
    unity_catalog_endpoint https://my-workspace.cloud.databricks.com

    # Table_Name
    # ==========
    # Target table as catalog.schema.table.
    table_name             main.default.logs

    # Schema_Descriptor_File (optional)
    # =================================
    # Protobuf FileDescriptorSet path; only used for protobuf mode. JSON mode
    # (the default) ignores it, so it may be omitted.
    # schema_descriptor_file /path/to/schema.desc

    # OAuth2
    # ======
    # The SDK performs the client-credentials exchange itself. Provide the
    # service-principal credentials; prefer environment variables over literals.
    oauth2.enable          true
    oauth2.client_id       ${DATABRICKS_CLIENT_ID}
    oauth2.client_secret   ${DATABRICKS_CLIENT_SECRET}
